<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mall List</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1>All Malls</h1>
<div class="filter-form">
    <form th:action="@{/malls}" method="get">
        <input type="text" name="name" th:value="${name}" placeholder="Filter by name...">
        <input type="text" name="city" th:value="${city}" placeholder="Filter by city...">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a th:href="@{/malls}" class="btn btn-secondary">Clear Filter</a>
    </form>
</div>
<a href="/malls/new" class="btn btn-primary">Add New Mall</a>
<table>
    <thead>
    <tr>
        <th>
            <a th:href="@{/malls(sortField='id', sortDir=${reverseSortDir}, name=${name}, city=${city})}">ID</a>
        </th>
        <th>
            <a th:href="@{/malls(sortField='name', sortDir=${reverseSortDir}, name=${name}, city=${city})}">Name</a>
        </th>
        <th>
            <a th:href="@{/malls(sortField='city', sortDir=${reverseSortDir}, name=${name}, city=${city})}">City</a>
        </th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mall : ${malls}">
        <td th:text="${mall.id}"></td>
        <td th:text="${mall.name}"></td>
        <td th:text="${mall.city}"></td>
        <td>
            <a th:href="@{'/malls/' + ${mall.id}}">Details</a> |
            <a th:href="@{'/malls/' + ${mall.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/malls/' + ${mall.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<br/><a href="/" class="back-link">Back to Menu</a>
</body>
</html>
