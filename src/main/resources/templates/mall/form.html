<html xmlns:th="http://www.thymeleaf.org">
<head><title>Mall Form</title></head>
<body>
<h1 th:text="${mall.id == null} ? 'Create Mall' : 'Edit Mall'">Create Mall</h1>

<form th:action="@{/malls}" th:object="${mall}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" />
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span><br>

    <label>City:</label>
    <input type="text" th:field="*{city}" />
    <span th:if="${#fields.hasErrors('city')}" th:errors="*{city}" style="color:red"></span><br>

    <button type="submit">Save Mall</button>
</form>
<br/><a href="/malls">Back to List</a>
</body>
</html>
