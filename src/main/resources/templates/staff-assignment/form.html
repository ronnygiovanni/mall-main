<html xmlns:th="http://www.thymeleaf.org">
<head><title>Staff Assignment</title></head>
<body>
<h1 th:text="${#strings.isEmpty(assignment.id)} ? 'New Assignment' : 'Edit Assignment'">Assignment</h1>

<div th:if="${error}" style="color: red; margin-bottom: 10px;">
    <strong>Error:</strong> <span th:text="${error}"></span>
</div>

<form th:action="@{/staff-assignments}" th:object="${assignment}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Staff Member ID:</label>
    <input type="text" th:field="*{staffId}" placeholder="Enter Staff ID" required /><br>

    <label>Floor ID:</label>
    <input type="text" th:field="*{floorId}" placeholder="Enter Floor ID" required /><br>

    <label>Shift:</label>
    <select th:field="*{shift}">
        <option th:each="opt : ${shifts}" th:value="${opt}" th:text="${opt}"></option>
    </select><br>

    <button type="submit">Save</button>
</form>
</body>
</html>
