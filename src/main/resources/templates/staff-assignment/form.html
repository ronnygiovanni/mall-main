<html xmlns:th="http://www.thymeleaf.org">
<body>
<h1>New Staff Assignment</h1>
<form th:action="@{/staff-assignments}" th:object="${assignment}" method="post">
    <label>Staff Member:</label>
    <select th:field="*{staffId}">
        <option th:each="s : ${allStaff}" th:value="${s.id}" th:text="${s.name}"></option>
    </select><br>

    <label>Floor:</label>
    <select th:field="*{floorId}">
        <option th:each="f : ${floors}" th:value="${f.id}" th:text="'Floor ' + ${f.number}"></option>
    </select><br>

    <label>Shift:</label>
    <select th:field="*{shift}">
        <option th:each="opt : ${shifts}" th:value="${opt}" th:text="${opt}"></option>
    </select><br>
    <button type="submit">Save</button>
</form>
</body>
</html
