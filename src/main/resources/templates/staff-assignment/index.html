<html xmlns:th="http://www.thymeleaf.org">
<head><title>Assignments</title></head>
<body>
<h1>Staff Assignments</h1>
<a href="/staff-assignments/new">New Assignment</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Staff</th>
        <th>Floor</th>
        <th>Shift</th>
        <th>Actions</th>
    </tr>
    <tr th:each="assignment : ${assignments}">
        <td th:text="${assignment.id}"></td>
        <td th:text="${assignment.staff != null} ? ${assignment.staff.name} : 'Unknown'"></td>
        <td th:text="${assignment.floor != null} ? 'Floor ' + ${assignment.floor.number} : 'Unknown'"></td>
        <td th:text="${assignment.shift}"></td>
        <td>
            <a th:href="@{'/staff-assignments/' + ${assignment.id}}">Details</a> |
            <a th:href="@{'/staff-assignments/' + ${assignment.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/staff-assignments/' + ${assignment.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
<br/><a href="/">Back to Menu</a>
</body>
</html>
