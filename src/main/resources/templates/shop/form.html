<html xmlns:th="http://www.thymeleaf.org">
<head><title>Shop Form</title></head>
<body>
<h1 th:text="${shop.id == null} ? 'Create Shop' : 'Edit Shop'">Shop</h1>

<div th:if="${error}" style="color:red; margin-bottom:10px; border: 1px solid red; padding: 5px;">
    <strong>Error:</strong> <span th:text="${error}"></span>
</div>

<form th:action="@{/shops}" th:object="${shop}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" />
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
    <br>

    <label>Owner Name:</label>
    <input type="text" th:field="*{ownerName}" />
    <span th:if="${#fields.hasErrors('ownerName')}" th:errors="*{ownerName}" style="color:red"></span>
    <br>

    <label>Area (sqm):</label>
    <input type="number" step="0.1" th:field="*{areaSqm}" />
    <span th:if="${#fields.hasErrors('areaSqm')}" th:errors="*{areaSqm}" style="color:red"></span>
    <br>

    <label>Rating (1-5):</label>
    <input type="number" th:field="*{rating}" min="1" max="5" />
    <span th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" style="color:red"></span>
    <br>

    <label>Floor ID:</label>
    <input type="number" name="floorId"
           th:value="${shop.floor != null ? shop.floor.id : ''}"
           placeholder="Enter Floor ID (e.g. 1)" required />
    <br>

    <button type="submit">Save Shop</button>
</form>
<br/>
<a href="/shops">Back to List</a>
</body>
</html>
