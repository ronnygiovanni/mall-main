<html xmlns:th="http://www.thymeleaf.org">
<head><title>Customer Form</title></head>
<body>
<h1 th:text="${customer.id == null} ? 'Create Customer' : 'Edit Customer'">Create Customer</h1>
<form th:action="@{/customers}" th:object="${customer}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Name:</label>
    <input type="text" th:field="*{name}" required /><br>

    <label>Currency:</label>
    <input type="text" th:field="*{currency}" required /><br>

    <button type="submit">Save Customer</button>
</form>
<br/>
<a href="/customers">Back to List</a>
</body>
</html>
