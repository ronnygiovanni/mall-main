<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Staff Form</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<div class="container">
    <h1 th:if="${staff.id == null}">Add Staff</h1>
    <h1 th:if="${staff.id != null}">Edit Staff</h1>

    <form th:action="@{/staff}" th:object="${staff}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control" placeholder="First Name"/>
            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></p>
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control" placeholder="Last Name"/>
            <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></p>
        </div>
        <div class="form-group">
            <label>Role</label>
            <input type="text" th:field="*{role}" class="form-control" placeholder="Role"/>
            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-danger"></p>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
</body>
</html>
