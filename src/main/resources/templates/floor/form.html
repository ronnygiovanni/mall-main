<html xmlns:th="http://www.thymeleaf.org">
<head><title>Floor Form</title></head>
<body>
<h1 th:text="${floor.id == null} ? 'Create Floor' : 'Edit Floor'">Create Floor</h1>
<form th:action="@{/floors}" th:object="${floor}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Floor Number:</label>
    <input type="number" th:field="*{number}" required /><br>

    <label>Mall:</label>
    <select th:field="*{mallId}" required>
        <option value="">-- Select Mall --</option>
        <option th:each="mall : ${malls}"
                th:value="${mall.id}"
                th:text="${mall.name}"></option>
    </select><br>

    <button type="submit">Save Floor</button>
</form>
<br/>
<a href="/floors">Back to List</a>
</body>
</html>
