<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Floor Form</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1 th:text="${floor.id == null} ? 'Create Floor' : 'Edit Floor'">Floor</h1>

<div th:if="${error}" style="color:red; margin-bottom:10px;">
    <span th:text="${error}"></span>
</div>

<div class="form-container">
    <form th:action="@{/floors}" th:object="${floor}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Floor Number:</label>
            <input type="number" th:field="*{number}" />
            <span th:if="${#fields.hasErrors('number')}" th:errors="*{number}" style="color:red"></span>
        </div>

        <div>
            <label>Mall:</label>
            <select name="mallId" required>
                <option value="">Select a Mall</option>
                <option th:each="mall : ${malls}"
                        th:value="${mall.id}"
                        th:text="${mall.name}"
                        th:selected="${floor.mall != null and floor.mall.id == mall.id}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Floor</button>
    </form>
</div>
<br/><a href="/floors" class="back-link">Back to List</a>
</body>
</html>
