<html xmlns:th="http://www.thymeleaf.org">
<body>
<h1 th:text="${#strings.isEmpty(task.id)} ? 'Plan Task' : 'Edit Task'">Task</h1>

<div th:if="${error}" style="color: red; margin-bottom: 10px;">
    <strong>Error:</strong> <span th:text="${error}"></span>
</div>

<form th:action="@{/maintenance}" th:object="${task}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Description:</label>
    <input type="text" th:field="*{description}" required /><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option value="Planned">Planned</option>
        <option value="Active">Active</option>
        <option value="Done">Done</option>
    </select><br>

    <label>Duration (mins):</label>
    <input type="number" th:field="*{duration}" /><br>

    <label>Floor ID:</label>
    <input type="text" th:field="*{floorId}" placeholder="Enter Floor ID" required /><br>

    <label>Assignment ID:</label>
    <input type="text" th:field="*{assignmentId}" placeholder="Enter Assignment ID (Optional)" /><br>

    <button type="submit">Save</button>
</form>
</body>
</html>
