<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Form</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1 th:text="${task.id == null} ? 'Plan Task' : 'Edit Task'">Task</h1>

<div th:if="${error}" style="color:red; margin-bottom:10px;">
    <span th:text="${error}"></span>
</div>

<div class="form-container">
    <form th:action="@{/maintenance}" th:object="${task}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Description:</label>
            <input type="text" th:field="*{description}" />
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red"></span>
        </div>

        <div>
            <label>Duration (mins):</label>
            <input type="number" th:field="*{duration}" />
            <span th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" style="color:red"></span>
        </div>

        <div>
            <label>Status:</label>
            <select th:field="*{status}">
                <option value="Planned">Planned</option>
                <option value="Active">Active</option>
                <option value="Done">Done</option>
            </select>
            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color:red"></span>
        </div>

        <div>
            <label>Floor:</label>
            <select th:field="*{floor}">
                <option value="">Select a Floor</option>
                <option th:each="floor : ${floors}"
                        th:value="${floor.id}"
                        th:text="'Floor ' + ${floor.number}"></option>
            </select>
            <span th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}" style="color:red"></span>
        </div>

        <div>
            <label>Assignment (Optional):</label>
            <select name="assignmentId">
                <option value="">None</option>
                <option th:each="assignment : ${assignments}"
                        th:value="${assignment.id}"
                        th:text="${assignment.id}"
                        th:selected="${task.assignment != null and task.assignment.id == assignment.id}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<br/><a href="/maintenance" class="back-link">Back to List</a>
</body>
</html>
