<html xmlns:th="http://www.thymeleaf.org">
<head><title>Task Details</title></head>
<body>
<h1>Maintenance Task</h1>
<p><strong>Description:</strong> <span th:text="${task.description}"></span></p>
<p><strong>Status:</strong> <span th:text="${task.status}"></span></p>
<p><strong>Duration:</strong> <span th:text="${task.duration}"></span> mins</p>
<p><strong>Location:</strong> Floor <span th:text="${floor.number}"></span></p>
<p><strong>Assigned To:</strong>
    <span th:if="${assignment != null}" th:text="${assignment.id}"></span>
    <span th:if="${assignment == null}">Unassigned</span>
</p>
<br/>
<a href="/maintenance">Back to List</a>
</body>
</html>
