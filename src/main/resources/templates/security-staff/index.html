<html xmlns:th="http://www.thymeleaf.org">
<head><title>Security Staff</title></head>
<body>
<h1>Security Staff</h1>
<a href="/security-staff/new">Add New Security Staff</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Badge No</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    <tr th:each="staff : ${staffList}">
        <td th:text="${staff.id}"></td>
        <td th:text="${staff.name}"></td>
        <td th:text="${staff.badgeNo}"></td>
        <td th:text="${staff.salary}"></td>
        <td>
            <a th:href="@{'/security-staff/' + ${staff.id}}">Details</a> |
            <a th:href="@{'/security-staff/' + ${staff.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/security-staff/' + ${staff.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
<br/>
<a href="/">Back to Menu</a>
</body>
</html>
