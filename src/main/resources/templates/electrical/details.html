<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Asset Details</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1>Asset Details</h1>

<div th:if="${asset != null}" class="form-container">
    <p><strong>Type:</strong> <span th:text="${asset.type}"></span></p>
    <p><strong>Status:</strong> <span th:text="${asset.status}"></span></p>
    <p><strong>Floor:</strong> <span th:text="'Floor ' + ${asset.floor.number}"></span></p>
    <p><strong>Assignment ID:</strong>
        <span th:text="${asset.assignment != null} ? ${asset.assignment.id} : 'None'"></span>
    </p>
</div>

<div th:if="${asset == null}">
    <p style="color:red">Error: Asset not found.</p>
</div>

<br/><a href="/assets" class="back-link">Back to List</a>
</body>
</html>
