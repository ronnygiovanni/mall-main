<html xmlns:th="http://www.thymeleaf.org">
<body>
<h1>Create Electrical Asset</h1>
<form th:action="@{/assets}" th:object="${asset}" method="post">
    <label>Type:</label>
    <select th:field="*{type}">
        <option value="Lift">Lift</option><option value="AC">AC</option><option value="Light">Light</option>
    </select><br>
    <label>Status:</label>
    <select th:field="*{status}">
        <option value="Working">Working</option><option value="Down">Down</option>
    </select><br>

    <label>Floor:</label>
    <select th:field="*{floorId}">
        <option th:each="f : ${floors}" th:value="${f.id}" th:text="'Floor ' + ${f.number}"></option>
    </select><br>

    <label>Assignment:</label>
    <select th:field="*{assignmentId}">
        <option value="">-- None --</option>
        <option th:each="a : ${assignments}" th:value="${a.id}" th:text="'Assign: ' + ${a.id}"></option>
    </select><br>
    <button type="submit">Save</button>
</form>
</body>
</html>
