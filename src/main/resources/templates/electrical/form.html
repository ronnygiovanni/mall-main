<html xmlns:th="http://www.thymeleaf.org">
<head><title>Asset Form</title></head>
<body>
<h1 th:text="${asset.id == null} ? 'New Asset' : 'Edit Asset'">Asset</h1>

<div th:if="${error}" style="color:red; margin-bottom:10px;">
    <span th:text="${error}"></span>
</div>

<form th:action="@{/assets}" th:object="${asset}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Type:</label>
    <select th:field="*{type}">
        <option value="Lift">Lift</option>
        <option value="AC">AC</option>
        <option value="Light">Light</option>
        <option value="Escalator">Escalator</option>
    </select><br>

    <label>Status:</label>
    <select th:field="*{status}">
        <option value="Working">Working</option>
        <option value="Down">Down</option>
    </select><br>

    <label>Floor ID:</label>
    <input type="number" name="floorId"
           th:value="${asset.floor != null ? asset.floor.id : ''}"
           required />
    <br>

    <label>Assignment ID (Optional):</label>
    <input type="number" name="assignmentId"
           th:value="${asset.assignment != null ? asset.assignment.id : ''}"
           placeholder="Optional" />
    <br>

    <button type="submit">Save</button>
</form>
<br/><a href="/assets">Back to List</a>
</body>
</html>
