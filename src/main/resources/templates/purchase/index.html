<html xmlns:th="http://www.thymeleaf.org">
<head><title>Purchases</title></head>
<body>
<h1>All Purchases</h1>
<a href="/purchases/new">New Purchase</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Customer</th>
        <th>Shop</th>
        <th>Actions</th>
    </tr>
    <tr th:each="purchase : ${purchases}">
        <td th:text="${purchase.id}"></td>
        <td th:text="${purchase.amount}"></td>
        <td th:text="${purchase.customer != null} ? ${purchase.customer.name} : 'Unknown'"></td>
        <td th:text="${purchase.shop != null} ? ${purchase.shop.name} : 'Unknown'"></td>
        <td>
            <a th:href="@{'/purchases/' + ${purchase.id}}">Details</a> |
            <a th:href="@{'/purchases/' + ${purchase.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/purchases/' + ${purchase.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
<br/><a href="/">Back to Menu</a>
</body>
</html>
