<html xmlns:th="http://www.thymeleaf.org">
<head><title>Purchase List</title></head>
<body>
<h1>All Purchases</h1>
<a href="/purchases/new">Make New Purchase</a>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Customer ID</th>
        <th>Shop ID</th>
        <th>Actions</th>
    </tr>
    <tr th:each="purchase : ${purchases}">
        <td th:text="${purchase.id}"></td>
        <td th:text="${purchase.amount}"></td>
        <td th:text="${purchase.customerId}"></td>
        <td th:text="${purchase.shopId}"></td>
        <td>
            <a th:href="@{'/purchases/' + ${purchase.id}}">Details</a> |
            <a th:href="@{'/purchases/' + ${purchase.id} + '/edit'}">Edit</a> |
            <form th:action="@{'/purchases/' + ${purchase.id} + '/delete'}" method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>
<br/>
<a href="/">Back to Menu</a>
</body>
</html>
