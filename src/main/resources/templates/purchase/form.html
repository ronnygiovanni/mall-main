<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Form</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1 th:text="${purchase.id == null} ? 'New Purchase' : 'Edit Purchase'">Purchase</h1>

<div th:if="${error}" style="color:red; margin-bottom:10px; border: 1px solid red; padding: 5px;">
    <strong>Error:</strong> <span th:text="${error}"></span>
</div>

<div class="form-container">
    <form th:action="@{/purchases}" th:object="${purchase}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Amount:</label>
            <input type="number" step="0.01" th:field="*{amount}" />
            <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" style="color:red"></span>
        </div>

        <div>
            <label>Customer:</label>
            <select name="customerId" required>
                <option value="">Select a Customer</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.name}"
                        th:selected="${purchase.customer != null and purchase.customer.id == customer.id}"></option>
            </select>
        </div>

        <div>
            <label>Shop:</label>
            <select name="shopId" required>
                <option value="">Select a Shop</option>
                <option th:each="shop : ${shops}"
                        th:value="${shop.id}"
                        th:text="${shop.name}"
                        th:selected="${purchase.shop != null and purchase.shop.id == shop.id}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save Purchase</button>
    </form>
</div>
<br/><a href="/purchases" class="back-link">Back to List</a>
</body>
</html>
