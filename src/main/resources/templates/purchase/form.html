<html xmlns:th="http://www.thymeleaf.org">
<head><title>Make Purchase</title></head>
<body>
<h1 th:text="${#strings.isEmpty(purchase.id)} ? 'New Purchase' : 'Edit Purchase'">Purchase</h1>

<div th:if="${error}" style="color: red; margin-bottom: 10px;">
    <strong>Error:</strong> <span th:text="${error}"></span>
</div>

<form th:action="@{/purchases}" th:object="${purchase}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label>Amount:</label>
    <input type="number" step="0.01" th:field="*{amount}" required /><br>

    <label>Customer ID:</label>
    <input type="text" th:field="*{customerId}" placeholder="Enter Customer ID" required /><br>

    <label>Shop ID:</label>
    <input type="text" th:field="*{shopId}" placeholder="Enter Shop ID" required /><br>

    <button type="submit">Save Purchase</button>
</form>
</body>
</html>
