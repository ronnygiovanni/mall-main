<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Purchase Details</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1>Purchase Details</h1>

<div th:if="${purchase != null}" class="form-container">
    <p><strong>Amount:</strong> <span th:text="${purchase.amount}"></span></p>
    <p><strong>Customer:</strong> <span th:text="${purchase.customer.name}"></span></p>
    <p><strong>Shop:</strong> <span th:text="${purchase.shop.name}"></span></p>
</div>

<div th:if="${purchase == null}">
    <p style="color:red">Error: Purchase not found.</p>
</div>

<br/><a href="/purchases" class="back-link">Back to List</a>
</body>
</html>
