<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Staff Details</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1>Maintenance Staff Details</h1>

<div th:if="${staff != null}" class="form-container">
    <p><strong>Name:</strong> <span th:text="${staff.name}"></span></p>
    <p><strong>Type:</strong> <span th:text="${staff.type}"></span></p>
    <p><strong>Salary:</strong> <span th:text="${staff.salary}"></span></p>
</div>

<div th:if="${staff == null}">
    <p style="color:red">Error: Staff not found.</p>
</div>

<br/><a href="/maintenance-staff" class="back-link">Back to List</a>
</body>
</html>
