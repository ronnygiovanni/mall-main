<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Maintenance Staff Form</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<h1 th:text="${staff.id == null} ? 'Add Maintenance Staff' : 'Edit Staff'">Add Staff</h1>

<div class="form-container">
    <form th:action="@{/maintenance-staff}" th:object="${staff}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div>
            <label>Name:</label>
            <input type="text" th:field="*{name}" />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
        </div>

        <div>
            <label>Salary:</label>
            <input type="number" th:field="*{salary}" required />
        </div>

        <div>
            <label>Specialization:</label>
            <select th:field="*{type}">
                <option value="Electrical">Electrical</option>
                <option value="Cleaning">Cleaning</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<br/><a href="/maintenance-staff" class="back-link">Back to List</a>
</body>
</html>
