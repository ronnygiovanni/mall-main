<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mall Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            font-size: 2.5rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }
        .card i {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 15px;
        }
        .card a {
            text-decoration: none;
            color: #34495e;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to the Mall Management System</h1>
    <div class="grid-container">
        <div class="card">
            <i class="fas fa-building"></i>
            <a th:href="@{/malls}">Manage Malls</a>
        </div>
        <div class="card">
            <i class="fas fa-layer-group"></i>
            <a th:href="@{/floors}">Manage Floors</a>
        </div>
        <div class="card">
            <i class="fas fa-store"></i>
            <a th:href="@{/shops}">Manage Shops</a>
        </div>
        <div class="card">
            <i class="fas fa-users"></i>
            <a th:href="@{/customers}">Manage Customers</a>
        </div>
        <div class="card">
            <i class="fas fa-shopping-cart"></i>
            <a th:href="@{/purchases}">Manage Purchases</a>
        </div>
        <div class="card">
            <i class="fas fa-user-shield"></i>
            <a th:href="@{/security-staff}">Manage Security Staff</a>
        </div>
        <div class="card">
            <i class="fas fa-hard-hat"></i>
            <a th:href="@{/maintenance-staff}">Manage Maintenance Staff</a>
        </div>
        <div class="card">
            <i class="fas fa-tasks"></i>
            <a th:href="@{/maintenance}">Manage Maintenance Tasks</a>
        </div>
        <div class="card">
            <i class="fas fa-bolt"></i>
            <a th:href="@{/assets}">Manage Electrical Assets</a>
        </div>
        <div class="card">
            <i class="fas fa-id-badge"></i>
            <a th:href="@{/staff-assignments}">Manage Staff Assignments</a>
        </div>
    </div>
</div>
</body>
</html>
