spring.application.name=MallManagement

# Microsoft SQL Server Configuration
# Note: 'encrypt=true;trustServerCertificate=true' is often needed for local dev
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=mall_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Banana123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Spring Boot usually detects the dialect automatically, but you can force it:
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect